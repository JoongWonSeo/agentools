[project]
name = "agentools"
version = "0.8.1"
description = ""
authors = [{ name = "Joong-Won Seo", email = "joong.won.seo@gmail.com" }]
requires-python = "~=3.10"
readme = "README.md"
dependencies = [
    "pydantic~=2.5",
    "tiktoken>=0.10.0,<0.11",
    "jsonref~=1.1",
    "docstring-parser>=0.15,<0.16",
    "json-autocomplete>=0.2,<0.3",
    "openai[realtime]>=1.61.0,<2",
    "jsonschema~=4.20",
    "qdrant-client~=1.9",
    "typing-extensions>=4.12.2,<5",
    "litellm>=1.74.7,<2",
]

[dependency-groups]
dev = ["ipykernel>=6.29.4,<7"]

[tool.hatch.build.targets.sdist]
include = ["agentools"]

[tool.hatch.build.targets.wheel]
include = ["agentools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
